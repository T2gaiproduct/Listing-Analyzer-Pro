# Included from the main sellerlens.io / listingauditor nginx server block.
# Ensures stale SPA chunks 404 instead of returning index.html, and correct cache headers.

location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

location = /build-id.json {
    try_files $uri =404;
    add_header Cache-Control "no-store";
}

location = /index.html {
    add_header Cache-Control "no-cache";
}
